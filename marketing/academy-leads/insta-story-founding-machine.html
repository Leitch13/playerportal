<!DOCTYPE html>
<!--
  INSTAGRAM STORY - founding spots, in JOHN'S look (blue duotone + machine + bold caps).
  1080 x 1920. The machine is a graphic MOTIF standing in for your photo.
  >>> TO USE YOUR REAL MACHINE PHOTO: set BG_IMAGE below to its URL (or a local path
      when hosting) and it replaces the motif exactly. <<<
-->
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Founding spots — story (machine look)</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-lo:#6aa6df; --blue:#2f6fc0; --blue-hi:#183a76; --navy:#0c2150;
    --paper:#F2F6FB; --line:rgba(255,255,255,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#061024;font-family:"Space Grotesk",system-ui,sans-serif;display:flex;justify-content:center;padding:20px}
  .story{
    width:1080px;height:1920px;position:relative;overflow:hidden;color:var(--paper);
    background:linear-gradient(165deg,#1c4e97 0%,#123a78 42%,#0c2150 100%);
  }
  /* machine motif layer */
  .machine{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:1500px;height:1500px;opacity:.5}
  .machine svg{width:100%;height:100%;display:block}
  /* optional real photo (set BG_IMAGE in script) */
  .photo{position:absolute;inset:0;background-size:cover;background-position:center;display:none;filter:saturate(1.1)}
  .duotone{position:absolute;inset:0;background:linear-gradient(165deg,rgba(28,78,151,.62),rgba(12,33,80,.82));mix-blend-mode:multiply}
  .vignette{position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 42%,transparent 40%,rgba(6,16,36,.55) 100%),linear-gradient(180deg,rgba(6,16,36,.55),transparent 22%,transparent 74%,rgba(6,16,36,.7))}

  .inner{position:relative;z-index:2;height:100%;padding:170px 90px 180px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .display{font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1}

  .brandrow{display:flex;align-items:center;gap:15px;justify-content:center}
  .logo{width:58px;height:58px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:"Anton",sans-serif;font-size:1.7rem;color:var(--blue-hi)}
  .brandrow .name{font-family:"Anton",sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:1.5rem;line-height:1;text-align:left}
  .brandrow .name small{display:block;font-family:"Space Grotesk",sans-serif;font-weight:500;font-size:.72rem;letter-spacing:.18em;color:#B9CCE6;margin-top:4px}

  .chip{display:inline-block;font-family:"Anton",sans-serif;font-size:1.5rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:linear-gradient(180deg,var(--blue-lo),var(--blue));padding:14px 30px;border-radius:6px;margin-top:70px;box-shadow:0 14px 40px -18px rgba(0,0,0,.6)}

  .only{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:2.8rem;letter-spacing:.16em;color:#DCE8F7;margin-top:60px}
  .num{font-family:"Anton",sans-serif;font-size:25rem;line-height:.76;color:#fff;text-shadow:0 10px 50px rgba(0,0,0,.45);margin:4px 0 0}
  .left{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:5rem;line-height:.95;margin-top:2px;color:#fff}

  .rule{width:130px;height:4px;background:#fff;border-radius:4px;margin:52px auto 0;opacity:.85}

  .machineword{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:3.6rem;line-height:.95;margin-top:42px;color:#fff}
  .desc{font-size:1.75rem;color:#D8E5F5;margin-top:22px;max-width:26ch;line-height:1.35;font-weight:500}
  .desc b{color:#fff;font-weight:700}

  .spacer{flex:1}

  .cta{background:linear-gradient(180deg,var(--blue-lo),var(--blue));border-radius:16px;padding:32px 40px;width:100%;box-shadow:0 20px 50px -22px rgba(0,0,0,.7)}
  .cta .v{font-family:"Anton",sans-serif;text-transform:uppercase;font-size:2.7rem;color:#fff;line-height:1.05}
  .cta .s{color:#EAF2FC;font-size:1.25rem;margin-top:12px;letter-spacing:.02em}
</style>
</head>
<body>
  <div class="story" id="story">
    <div class="photo" id="photo"></div>
    <div class="machine" id="machine"></div>
    <div class="duotone"></div>
    <div class="vignette"></div>

    <div class="inner">
      <div class="brandrow"><div class="logo">A</div><div class="name">ASCEND<small>BY JOHN LEITCH COACHING</small></div></div>
      <span class="chip">Founding members</span>

      <div class="only">Only</div>
      <div class="num">5</div>
      <div class="left">Spaces left</div>

      <div class="rule"></div>
      <div class="machineword">THE LEAD MACHINE</div>
      <div class="desc">Your academy&rsquo;s lead system &mdash; <b>built for you.</b> Free inside ASCEND.</div>

      <div class="spacer"></div>
      <div class="cta">
        <div class="v">DM me &ldquo;MACHINE&rdquo;</div>
        <div class="s">to grab a founding spot &rarr;</div>
      </div>
    </div>
  </div>

<script>
  /* ===== to use your real machine photo instead of the motif: ===== */
  var BG_IMAGE = ''; // e.g. 'https://.../machine.jpg'  (leave blank to use the drawn motif)
  if (BG_IMAGE){
    var p = document.getElementById('photo');
    p.style.backgroundImage = 'url(' + BG_IMAGE + ')';
    p.style.display = 'block';
    document.getElementById('machine').style.display = 'none';
  }

  /* ===== draw the radial machine motif (stand-in for the photo) ===== */
  (function(){
    var cx=750, cy=750, parts=[];
    function ring(r,w,o){ parts.push('<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#bcd6f5" stroke-width="'+w+'" opacity="'+o+'"/>'); }
    ring(690,10,.5); ring(600,4,.4); ring(560,18,.35); ring(470,3,.4); ring(360,26,.3); ring(250,4,.5);
    // radial spokes
    for(var i=0;i<20;i++){
      var a=(i/20)*Math.PI*2, x1=cx+Math.cos(a)*250, y1=cy+Math.sin(a)*250, x2=cx+Math.cos(a)*690, y2=cy+Math.sin(a)*690;
      parts.push('<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#a9c8ef" stroke-width="6" opacity="'+(i%2?.28:.4)+'"/>');
    }
    // bolt heads around a ring
    for(var j=0;j<24;j++){
      var b=(j/24)*Math.PI*2, bx=cx+Math.cos(b)*630, by=cy+Math.sin(b)*630;
      parts.push('<circle cx="'+bx+'" cy="'+by+'" r="13" fill="none" stroke="#cfe1f8" stroke-width="4" opacity=".5"/>');
    }
    // inner segmented ring
    for(var k=0;k<12;k++){
      var s=(k/12)*Math.PI*2, sx=cx+Math.cos(s)*150, sy=cy+Math.sin(s)*150;
      parts.push('<circle cx="'+sx+'" cy="'+sy+'" r="22" fill="none" stroke="#bcd6f5" stroke-width="5" opacity=".4"/>');
    }
    // hub
    parts.push('<circle cx="'+cx+'" cy="'+cy+'" r="140" fill="none" stroke="#dce9fb" stroke-width="10" opacity=".55"/>');
    parts.push('<circle cx="'+cx+'" cy="'+cy+'" r="70" fill="none" stroke="#dce9fb" stroke-width="6" opacity=".55"/>');
    document.getElementById('machine').innerHTML =
      '<svg viewBox="0 0 1500 1500" xmlns="http://www.w3.org/2000/svg">'+parts.join('')+'</svg>';
  })();
</script>
</body>
</html>
